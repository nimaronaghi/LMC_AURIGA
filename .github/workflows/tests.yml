name: Scientific validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
  scientific-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[plot,parallel,test]"
      - run: python -m pytest -q
      - run: python -m lmc_auriga demo --output results/ci-demo --figures
      - run: python -m lmc_auriga benchmark --output results/ci-benchmark --counts 1000 10000 --repeats 3
      - uses: actions/upload-artifact@v7
        with:
          name: scientific-validation-output
          path: results/
